name: Deploy to VPS

on:
  push:
    branches:
      - main  # Runs every time you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd hr-automation
            
            # Update git remote and pull latest code
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git || true
            git pull origin main
            
            # Ensure package-lock.json exists (needed for npm ci)
            if [ ! -f package-lock.json ]; then
              echo "Warning: package-lock.json not found. Run 'npm install' locally first."
            fi
            
            # Stop and remove existing containers (--volumes removes volumes too)
            docker compose down --volumes --remove-orphans || true
            
            # Remove old images to force fresh build
            docker compose build --no-cache --pull \
              --build-arg NEXT_PUBLIC_BETTER_AUTH_BASEURL=${NEXT_PUBLIC_BETTER_AUTH_BASEURL:-} \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
            
            # Remove dangling images to free up space
            docker image prune -f || true
            
            # Start containers in detached mode
            docker compose up -d
            
            # Wait for container to be healthy (up to 2 minutes)
            echo "Waiting for application to be healthy..."
            timeout=120
            elapsed=0
            while [ $elapsed -lt $timeout ]; do
              if docker compose ps | grep -q "healthy"; then
                echo "Container is healthy!"
                break
              fi
              sleep 5
              elapsed=$((elapsed + 5))
              echo "Waiting... ($elapsed/$timeout seconds)"
            done
            
            # Show container status
            docker compose ps
            
            # Show recent logs
            docker compose logs --tail=50
            
            # Clear nginx cache if nginx is installed and running
            if command -v nginx &> /dev/null; then
              echo "Clearing nginx cache..."
              sudo rm -rf /var/cache/nginx/* || true
              sudo nginx -s reload || true
            fi
